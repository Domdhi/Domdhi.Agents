[[rules]]
id = "domdhi-shopify-token"
description = "Shopify Token (shape of the retired scanner pattern)."
regex = '''shp(?:at|ca|pa|ss)_[a-fA-F0-9]{32,}'''
keywords = ["shpat_", "shpca_", "shppa_", "shpss_"]

[[rules]]
id = "domdhi-npm-token"
