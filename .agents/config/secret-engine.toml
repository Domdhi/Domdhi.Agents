# --- Generic credential literals (replace the retired Password/Secret Assignment regexes) ---
# A quoted literal after a credential-named assignment. The base rule takes the first literal
# after the name; the -after-N rules skip N literals (get("fieldName") ?? "real-fallback") so
# a fallback literal is still found. A continuation line that starts with an operator counts as
# the same statement. The literal must be 8+ characters. In prose files (markdown, text) a
# backtick span is inline code, not a string literal, so it never counts.

[[rules]]
id = "domdhi-credential-literal"
description = "Credential-named assignment holding a quoted literal"
regex = '''(?i)(?:passw(?:or)?d|passwd|pwd|secret|api_?key|apikey|access_?key|auth_?token|client_?secret)['"\x60]?[ \t]*(?::=|=>|[=:])[ \t]*(?:[^'"\x60\n;}\])]|\([^()'"\x60\n;{}\[\]]*\)|\n[ \t\n]*(?:\?\?|\|\||&&|\?|:|\+)){0,100}?(?:"([^"\n]{8,250})"|'([^'\n]{8,250})'|\x60([^\x60\n]{8,250})\x60)'''
keywords = ["passw", "pwd", "secret", "apikey", "api_key", "accesskey", "access_key", "authtoken", "auth_token"]
confidence = "medium"
filter = '''
let sv = finding["secret"];
let code = filter.matchesAny(attributes["path"], [`(?i)\.(?:[cm]?[jt]sx?|py|rb|go|rs|java|kt|kts|cs|php|swift|scala|c|cc|cpp|h|hpp)$`]);
let direct = filter.matchesAny(finding["match"], [`^(?i)(?:passw(?:or)?d|passwd|pwd|secret|api_?key|apikey|access_?key|auth_?token|client_?secret)['"\x60]?[ \t]*(?::=|=>|[=:])[ \t]*['"\x60]`]);
let pre = finding["match"][:indexOf(finding["match"], sv)];
let lookup = filter.matchesAny(pre, [`(?i)(?:header|headers|get|getenv|getSecret|env|environ|require|import|param|query|cookie|read|readEnv|requireEnv|mustGetEnv|GetEnvironmentVariable|GetValue|GetRequiredValue|Configuration|config)(?:<[\w.?]+>)?[ \t]*[\(\[][ \t]*['"\x60]?$`]) && filter.matchesAny(sv, [`^[a-z]+(?:[A-Z][a-z]+)*$`, `^[a-z]+(?:[-_][a-z]+)+$`, `^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$`, `^[A-Za-z_][A-Za-z0-9_]*(?::[A-Za-z_][A-Za-z0-9_]*)+$`]);
let test = filter.matchesAny(sv, [`^[a-z][a-z-]*$`]) && filter.matchesAny(pre, [`(?i)\.(?:includes|startsWith|endsWith|indexOf|has|test|match)\(\s*['"\x60]?$`]);
let prose = filter.matchesAny(attributes["path"], [`(?i)\.(?:md|mdx|markdown|txt|rst|adoc)$`]);
lookup || test || sv contains "${"
|| !(code || direct)
// The value belongs to a later property, or IS a later property's key
// (apikey: ANON, "content-type": "application/json").
|| filter.matchesAny(pre, [`,[ \t]*["'\x60]?[\w-]+["'\x60]?[ \t]*:`])
|| (indexOf(finding["line"], finding["match"]) >= 0 && filter.matchesAny(finding["line"][indexOf(finding["line"], finding["match"]) + len(finding["match"]):], [`^[ \t]*:`]))
|| (prose && filter.matchesAny(pre, [`\x60$`]))
'''

[[rules]]
id = "domdhi-credential-literal-after-1"
description = "Credential-named assignment holding a literal after one other literal"
regex = '''(?i)(?:passw(?:or)?d|passwd|pwd|secret|api_?key|apikey|access_?key|auth_?token|client_?secret)['"\x60]?[ \t]*(?::=|=>|[=:])[ \t]*(?:(?:[^'"\x60\n;}\]]|\n[ \t\n]*(?:\?\?|\|\||&&|\?|:|\+)){0,100}?(?:"[^"\n]*"|'[^'\n]*'|\x60[^\x60\n]*\x60)){1}(?:[^'"\x60\n;}\]]|\n[ \t\n]*(?:\?\?|\|\||&&|\?|:|\+)){0,100}?(?:"([^"\n]{8,250})"|'([^'\n]{8,250})'|\x60([^\x60\n]{8,250})\x60)'''
keywords = ["passw", "pwd", "secret", "apikey", "api_key", "accesskey", "access_key", "authtoken", "auth_token"]
confidence = "medium"
filter = '''
let sv = finding["secret"];
let code = filter.matchesAny(attributes["path"], [`(?i)\.(?:[cm]?[jt]sx?|py|rb|go|rs|java|kt|kts|cs|php|swift|scala|c|cc|cpp|h|hpp)$`]);
// Skipping literals is for fallback chains (get("k") ?? "real"); crossing ", key:" means another property.
sv contains "${" || !code
|| filter.matchesAny(finding["match"], [`,[ \t]*["'\x60]?[\w-]+["'\x60]?[ \t]*:`])
'''

[[rules]]
id = "domdhi-credential-literal-after-2"
description = "Credential-named assignment holding a literal after two other literals"
regex = '''(?i)(?:passw(?:or)?d|passwd|pwd|secret|api_?key|apikey|access_?key|auth_?token|client_?secret)['"\x60]?[ \t]*(?::=|=>|[=:])[ \t]*(?:(?:[^'"\x60\n;}\]]|\n[ \t\n]*(?:\?\?|\|\||&&|\?|:|\+)){0,100}?(?:"[^"\n]*"|'[^'\n]*'|\x60[^\x60\n]*\x60)){2}(?:[^'"\x60\n;}\]]|\n[ \t\n]*(?:\?\?|\|\||&&|\?|:|\+)){0,100}?(?:"([^"\n]{8,250})"|'([^'\n]{8,250})'|\x60([^\x60\n]{8,250})\x60)'''
keywords = ["passw", "pwd", "secret", "apikey", "api_key", "accesskey", "access_key", "authtoken", "auth_token"]
confidence = "medium"
filter = '''
let sv = finding["secret"];
let code = filter.matchesAny(attributes["path"], [`(?i)\.(?:[cm]?[jt]sx?|py|rb|go|rs|java|kt|kts|cs|php|swift|scala|c|cc|cpp|h|hpp)$`]);
// Skipping literals is for fallback chains (get("k") ?? "real"); crossing ", key:" means another property.
sv contains "${" || !code
|| filter.matchesAny(finding["match"], [`,[ \t]*["'\x60]?[\w-]+["'\x60]?[ \t]*:`])
'''

# Unquoted NAME=value / NAME: value lines (env, shell, ini, yaml, properties, prose).
# In source files only a line-leading, in-string or in-comment occurrence counts: a bare
# identifier assigned in code is a reference, not a literal.
[[rules]]
id = "domdhi-secret-line"
description = "Unquoted credential-named assignment holding a literal value"
regex = '''(?i)(?:passw(?:or)?d|passwd|secret|api_?key|apikey|access_?key|auth_?token|client_?secret)[ \t]*[=:][ \t]*([^\s'"\x60$<{][^\s]{7,})'''
keywords = ["passw", "secret", "apikey", "api_key", "accesskey", "access_key", "authtoken", "auth_token"]
confidence = "medium"
filter = '''
let sv = finding["secret"];
let path = attributes["path"];
let pre = finding["fragment_raw"][finding["match_line_start_idx"]:finding["match_start_idx"]];
let rest = finding["fragment_raw"][finding["match_end_idx"]:min(finding["match_end_idx"] + 400, len(finding["fragment_raw"]))];
let code = filter.matchesAny(path, [`(?i)\.(?:[cm]?[jt]sx?|py|rb|go|rs|java|kt|kts|cs|php|swift|scala|c|cc|cpp|h|hpp)$`]);
let prose = filter.matchesAny(path, [`(?i)\.(?:md|mdx|markdown|txt|rst|adoc)$`]);
let lineLead = filter.matchesAny(pre, [`^[ \t]*(?:\d+\t[ \t]*)?(?:export[ \t]+)?[\w.-]*$`]);
let stringOrComment = filter.matchesAny(pre, [`//|/\*|^[ \t]*(?:\d+\t[ \t]*)?\*|(?:^|[ \t])#`])
  || (len(split(pre, "\"")) % 2 == 0) || (len(split(pre, "'")) % 2 == 0) || (len(split(pre, "\x60")) % 2 == 0);
let credentialShaped = filter.matchesAny(sv, [`\d`]) && !(sv contains "(");
(code && !stringOrComment && !(lineLead && credentialShaped))
|| ((code || prose) && filter.matchesAny(sv, [`^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+[;,)]?$`]) && !filter.matchesAny(sv, [`[A-Za-z0-9]{16,}`]))
|| (prose && filter.matchesAny(sv, [`^[A-Za-z][A-Za-z-]*[;,.)]*$`]))
|| (filter.matchesAny(pre, [`//|/\*|^[ \t]*(?:\d+\t[ \t]*)?\*|(?:^|[ \t])#`]) && filter.matchesAny(sv, [`^[A-Za-z][A-Za-z-]*[;,.)]*$`]))
|| filter.matchesAny(sv, [`^[;,)\]}]+$`, `[=<>]{2}`])
'''

# Connection strings with an embedded password. The built-in rule ignores example hosts, which
# hides a real-looking password behind db.example.com, so these judge the password only. A password
# may contain "/" (generated and base64-style passwords do); a driver suffix (postgresql+psycopg2://)
# and rediss:// are covered. https://user:password@host is a separate rule whose password cannot
# contain "/", so a port followed by a path and an "@" does not read as credentials.
[[rules]]
id = "domdhi-connection-string"
description = "Database or broker URL with an embedded password"
regex = '''(?i)(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|rediss?|amqps?|mssql)(?:\+[a-z0-9]+)?://[^\s'"@:/]{0,256}:([^\s'"@]{1,256})@[^\s'"/]{1,253}'''
keywords = ["mongodb", "postgres", "mysql", "mariadb", "redis", "amqp", "mssql"]

[[rules]]
id = "domdhi-url-credentials"
description = "http(s) URL with an embedded password"
regex = '''(?i)\bhttps?://[^\s'"@:/]{1,128}:([^\s'"@/]{1,256})@[a-z0-9][a-z0-9._-]{0,252}'''
keywords = ["http://", "https://"]

[[rules]]
id = "domdhi-database-url"
description = "DATABASE_URL holding a URL with an embedded password"
regex = '''(?i)DATABASE_URL[ \t]*=[ \t]*['"]?[a-z][a-z0-9+.-]*://[^\s'"@:/]{0,256}:([^\s'"@]{1,256})@[^\s'"/]{1,253}'''
keywords = ["database_url"]

# A private key header alone (a truncated key) is still a leak; take the body lines after it.
[[rules]]
id = "domdhi-private-key-block"
description = "Private key header with any base64 body lines that follow"
regex = '''-----BEGIN[ A-Z]*PRIVATE KEY[ A-Z]*-----(?:[ \t]*\r?\n[A-Za-z0-9+/=]{16,}[ \t]*)*(?:[ \t]*\r?\n-----END[ A-Z]*PRIVATE KEY[ A-Z]*-----)?'''
keywords = ["private key"]
