[[rules]]
id = "domdhi-hashicorp-tf-token"
description = "Hashicorp TF Token (shape of the retired scanner pattern)."
regex = '''[a-zA-Z0-9]{14}\.atlasv1\.[a-zA-Z0-9_-]{67}'''
