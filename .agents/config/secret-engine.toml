title = "Domdhi.Agents secret engine"

# Config for the pinned Betterleaks engine (the version and checksums are in secret-engine.json).
# It extends the built-in rules and adds what the parity harness proved missing: every named
# provider of the retired scanner (domdhi-* rules below mirror NAMED_PROVIDER_PATTERNS in
# hooks/secret-patterns.cjs; a unit test keeps the two lists in step) and the generic
# credential rules.
# House rules: regexes and Expr filters only; no network validation, ever; a rule that is a
# generic (non-provider) rule must be listed in genericRuleIds in secret-engine.json, in the
# "generic" list of the global filter below, and gets the placeholder exemptions.

# Path skipping belongs to the Node wrapper (isHardSkipPath), not to the engine. The built-in
# prefilter skips whole path classes (vendor/, node_modules/, images, lockfiles), which would
# let a Write to such a path through unscanned.
prefilter = "false"

# Global filter. A top-level filter REPLACES the built-in one, so this keeps the built-in
# non-secret value shapes, then drops placeholder and runtime-reference VALUES for the
# generic (non-provider) rules only. A named-provider rule is never exempted here.
filter = '''
let sv = finding["secret"];
// Some built-in rules capture the quotes around the value; the placeholder checks look inside them.
let pv = trim(sv, "\"'\x60");
let generic = finding["rule_id"] in [
  "generic-api-key", "generic-password", "generic-username",
  "domdhi-credential-literal", "domdhi-credential-literal-after-1", "domdhi-credential-literal-after-2", "domdhi-secret-line",
  "hashicorp-tf-password", "curl-auth-user", "curl-auth-header", "kubernetes-secret-yaml", "nuget-config-password"
];
let conn = finding["rule_id"] in ["generic-credential-uri", "mongodb-connection-string", "domdhi-connection-string", "domdhi-url-credentials", "domdhi-database-url"];
filter.matchesAny(sv, [
  `(?i)^(?:true|false|null)$`,
  `^(?i:a+|b+|c+|d+|e+|f+|g+|h+|i+|j+|k+|l+|m+|n+|o+|p+|q+|r+|s+|t+|u+|v+|w+|x+|y+|z+|\*+|\.+)$`,
  `^\$(?:\d+|{\d+})$`,
  `^\$(?:[A-Z_]+|[a-z_]+)$`,
  `^\${(?:[A-Z_]+|[a-z_]+)}$`,
  `^\{\{[ \t]*[\w ().|]+[ \t]*}}$`,
  `^\$\{\{[ \t]*(?:(?:env|github|secrets|vars)(?:\.[A-Za-z]\w+)+[\w "'&./=|]*)[ \t]*}}$`,
  `^%(?:[A-Z_]+|[a-z_]+)%$`,
  `^%[+\-# 0]?[bcdeEfFgGoOpqstTUvxX]$`,
  `^\{\d{0,2}}$`,
  `^@(?:[A-Z_]+|[a-z_]+)@$`,
  `^/[U]sers/(?i)[a-z0-9]+/[\w .-/]+$`,
  `^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$`
])
|| sv == "014df517-39d1-4453-b7b3-9930c563627c"
// Code shapes, not values, when they hold no long random run: a dotted reference (env.API_KEY), a call
// whose callee has no digits (z.string(), Buffer.from(...); Summer2024(!) is still a password), a type
// annotation (string, Uint8Array) or a constant / env-name reference (TEST_KEY).
|| (generic && !filter.matchesAny(pv, [`[A-Za-z0-9]{16,}`]) && filter.matchesAny(pv, [
  `^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+[;,)\x60'"]*$`,
  `^(?:[A-Za-z_$][A-Za-z_$]*\.)*[A-Za-z_$][A-Za-z_$]*\(`,
  `^(?:string|number|boolean|bigint|unknown|any|object|never|void|Uint8Array|Uint16Array|Uint32Array|Int8Array|Int16Array|Int32Array|Float32Array|Float64Array|Buffer|ArrayBuffer|CryptoKey|KeyObject|Promise|Record|Partial|Readonly|Array|Map|Set)\b`,
  `^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+[;,)\x60'"]*$`,
  // text with a space: an error message or prose ("Invalid API key")
  `\s`
]))
// A PEM header with no key body: JSDoc mentions, "..." placeholders and ${lines} builder templates.
|| (finding["rule_id"] in ["private-key", "domdhi-private-key-block"] && (sv contains "${" || !filter.matchesAny(sv, [`[A-Za-z0-9+/]{16,}`])))
// A Stripe-shaped key whose tail is only a placeholder word (a real key is 24+ random characters).
|| (finding["rule_id"] in ["stripe-access-token", "domdhi-stripe-key"] && filter.matchesAny(pv, [`(?i)^(?:sk|rk|pk)_(?:test|live)_(?:placeholder|dummy|example|fake|mock|sample|test|x+|your[_a-z]*)$`]))
|| (finding["rule_id"] == "generic-api-key" && filter.matchesAny(sv, [`^[0-9a-fA-F]{32}$`, `^[0-9a-fA-F]{40}$`, `^[0-9a-fA-F]{56}$`, `^[0-9a-fA-F]{64}$`, `^[0-9a-fA-F]{96}$`, `^[0-9a-fA-F]{128}$`])
  && (filter.matchesAny(attributes["path"], [`(?:^|/)render-state\.json$`])
    || filter.matchesAny(finding["line"][:max(indexOf(finding["line"], sv), 0)], [`(?i)(?:sha\d*|digest|hash|checksum|integrity|etag|fingerprint)\w*['"\s]{0,3}[:=]\s*['"\x60]?$`])))
|| (generic && (
  pv in ["local-dev-key", "1x0000000000000000000000000000000AA", "2x0000000000000000000000000000000AA", "3x0000000000000000000000000000000AA", "base64url"]
  || filter.matchesAny(pv, [
    `(?i)^(?:changeme|password|secret|example|test(?:ing)?|dummy|placeholder|xxx+|sample|default)$`,
    `(?i)^(?:db|my|app|admin|user|root)?pass(?:word|wd)?\d{0,3}$`,
    `(?i)^(?:[a-z0-9]{2,8}_)?your(?:[_-][a-z]+)+$`,
    `(?i)^[a-z]+(?:_[a-z]+)*_here$`,
    `(?i)^(?:your[_-]?(?:key|token|secret|password|api[_-]?key)|TODO|REPLACE[_-]?ME|INSERT[_-]?HERE)$`,
    `(?i)^(?:test(?:ing)?|mock|fake|sample|example|dummy|placeholder)[-_][a-z0-9][a-z0-9_-]{0,15}$`,

    `(?i)^your(?:[_-][A-Za-z]+)+$`,
    `^\[[A-Za-z][A-Za-z _-]*\]$`,
    `(?i)^(?:[a-z]{1,8}[_-]){0,3}abc123(?:\.{3}|…)?$`,
    `^<[^>]+>$`,
    `^\{[^}]+\}$`,
    `^\$\{[^}]+\}$`,
    `^VAULT:[A-Za-z0-9_]+:[A-Za-z0-9_]+$`,
    `^env\([A-Z0-9_]+\)$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*env\.[A-Z][A-Z0-9_]*[,;)]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*(?:env|environ)\[['"][A-Z][A-Z0-9_]*['"]\][,;)]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*(?:env|environ)\.get\(['"][A-Z][A-Z0-9_]*['"]\)[,;)]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:(?:os|System)\.)?getenv\(['"][A-Z][A-Z0-9_]*['"]\)[,;)]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*GetEnvironmentVariable\(['"][A-Za-z_][A-Za-z0-9_]*['"]\)[,;)]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*(?:Configuration|configuration|config|Config)\[['"][A-Za-z_][A-Za-z0-9_]*(?::[A-Za-z_][A-Za-z0-9_]*)*['"]\][,;)!]*)['"\x60]?$`,
    `^['"\x60]?(?:(?:[A-Za-z_$][\w$]*\.)*(?:Configuration|configuration|config|Config)\.(?:GetValue|GetRequiredValue)(?:<[\w.?]+>)?\(['"][A-Za-z_][A-Za-z0-9_]*(?::[A-Za-z_][A-Za-z0-9_]*)*['"]\)[,;)!]*)['"\x60]?$`,
    `^['"\x60]?(?:\$\{\{\s*(?:secrets|vars|env)\.[A-Za-z_][A-Za-z0-9_]*\s*\}\})['"\x60]?$`,
    `^['"\x60]?(?:\$\([A-Za-z_][A-Za-z0-9_.]*\))['"\x60]?$`,
    `^['"\x60]?(?:%[A-Za-z_][A-Za-z0-9_]*%)['"\x60]?$`,
    `^['"\x60]?(?:@Microsoft\.KeyVault\((?:SecretUri|VaultName)=[^()\s'"]+(?:;[A-Za-z]+=[^()\s'"]+)*\))['"\x60]?$`
  ])
))
|| (finding["rule_id"] == "generic-password" && filter.matchesAny(attributes["path"], [`(?i)\.(?:[cm]ts|svelte|astro)$`]) && filter.matchesAny(finding["match"], [`^(?i:passw(?:or)?d|psw|[_.-]pw)\b[ \t'"\\]{0,3}(?:=>|:=|=|:)[ \t]*[^\x22\x27\x60 \t\r\n]`]))
|| (conn && filter.matchesAny(sv, [
  `(?i)^(?:user(?:name)?|pass(?:word|wd)?|pwd|secret|changeme|example|test(?:ing)?|dummy|placeholder|sample|default|xxx+)$`,
  `^<[^>]+>$`,
  `^\{[^}]+\}$`,
  `^\$\{[^}]+\}$`,
  `^\$[A-Z_]+$`
]))
'''

[extend]
useDefault = true

# --- Named providers the built-in rules do not cover (shapes match the retired scanner) ---

[[rules]]
id = "domdhi-aws-access-key"
description = "AWS access key ID (standalone). The built-in rule misses a lone key ID."
regex = '''AKIA[0-9A-Z]{16}'''
keywords = ["akia"]
filter = '''
finding["secret"] == "AKIAIOSFODNN7" + "EXAMPLE"
&& filter.matchesAny(attributes["path"], [`(?:^|[/\\])__tests?__[/\\]`, `\.(?:test|spec)\.(?:[cm]?[jt]sx?)$`])
'''

[[rules]]
id = "domdhi-aws-secret-key"
description = "AWS secret access key assigned to an aws_secret* name."
regex = '''(?i)(?:aws_secret_access_key|aws_secret)[ \t]*[=:][ \t]*['"]?([A-Za-z0-9/+=]{40})['"]?'''
keywords = ["aws_secret"]

[[rules]]
id = "domdhi-aws-session-token"
description = "AWS session token assigned to an aws_session_token name."
regex = '''(?i)aws_session_token[ \t]*[=:][ \t]*['"]?([A-Za-z0-9/+=]{100,})['"]?'''
keywords = ["aws_session_token"]

[[rules]]
id = "domdhi-azure-storage-key"
description = "Azure storage account key."
regex = '''AccountKey=[A-Za-z0-9+/=]{88}'''
keywords = ["accountkey="]

[[rules]]
id = "domdhi-azure-sas-token"
description = "Azure shared access signature."
regex = '''[?&]sig=([A-Za-z0-9%+/=]{43,})(?:&|[\s'"]|$)'''
keywords = ["sig="]

[[rules]]
id = "domdhi-google-oauth-client-secret"
description = "Google OAuth client secret."
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["gocspx-"]

[[rules]]
id = "domdhi-bitbucket-app-password"
description = "Bitbucket app password."
regex = '''ATBB[A-Za-z0-9]{32,}'''
keywords = ["atbb"]

[[rules]]
id = "domdhi-discord-webhook"
description = "Discord webhook URL."
regex = '''discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+'''
keywords = ["/api/webhooks/"]

[[rules]]
id = "domdhi-openai-key"
description = "OpenAI API key."
regex = '''sk-[A-Za-z0-9]{20,}'''
keywords = ["sk-"]

[[rules]]
id = "domdhi-openai-project-key"
description = "OpenAI project API key."
regex = '''sk-proj-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-proj-"]

[[rules]]
id = "domdhi-openai-service-key"
description = "OpenAI service account key."
regex = '''sk-svcacct-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-svcacct-"]

[[rules]]
id = "domdhi-anthropic-key"
description = "Anthropic API key."
regex = '''sk-ant-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "domdhi-square-oauth-secret"
description = "Square OAuth secret."
regex = '''sq0csp-[A-Za-z0-9_-]{43,}'''
keywords = ["sq0csp-"]

[[rules]]
id = "domdhi-coingecko-api-key"
description = "CoinGecko API key."
regex = '''\bCG-[A-Za-z0-9]{20,}\b'''
keywords = ["cg-"]

[[rules]]
id = "domdhi-pypi-token"
description = "PyPI upload token."
regex = '''pypi-[A-Za-z0-9_-]{100,}'''
keywords = ["pypi-"]

[[rules]]
id = "domdhi-nuget-api-key"
description = "NuGet API key."
