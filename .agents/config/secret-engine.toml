keywords = ["ccipat_"]

[[rules]]
id = "domdhi-hashicorp-vault-token"
description = "HashiCorp Vault service token."
regex = '''hvs\.[A-Za-z0-9_-]{24,}'''
keywords = ["hvs."]

[[rules]]
id = "domdhi-vercel-token"
description = "Vercel token."
regex = '''(?i)vercel_[A-Za-z0-9_-]{24,}'''
keywords = ["vercel_"]

[[rules]]
id = "domdhi-telegram-bot-token"
description = "Telegram bot token."
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
keywords = [":"]

[[rules]]
id = "domdhi-twilio-key"
description = "Twilio API key SID."
regex = '''\bSK[0-9a-fA-F]{32}\b'''
keywords = ["sk"]

[[rules]]
id = "domdhi-mailgun-key"
description = "Mailgun API key."
regex = '''\bkey-[0-9a-zA-Z]{32}\b'''
keywords = ["key-"]

[[rules]]
id = "domdhi-bearer-token"
description = "Long bearer token in an Authorization header or code."
regex = '''[Bb]earer[ \t]+([A-Za-z0-9_\-.~+/]{40,}=*)'''
keywords = ["bearer"]


[[rules]]
id = "domdhi-azure-connection-string"
description = "Azure Connection String (shape of the retired scanner pattern)."
regex = '''DefaultEndpointsProtocol=https?;AccountName=[^;]+;AccountKey=[^;]+'''
keywords = ["defaultendpointsprotocol"]

[[rules]]
id = "domdhi-gcp-service-account"
description = "GCP Service Account (shape of the retired scanner pattern)."
regex = '''"private_key":\s*"-----BEGIN [A-Z ]+ PRIVATE KEY-----'''
