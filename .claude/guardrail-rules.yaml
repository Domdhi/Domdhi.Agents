# ============================================================
# DANGEROUS PATTERNS (A3 — bash-level hard block)
# ============================================================
# Parallel channel to block_patterns above — use this list when a pattern
# comes from a competitor-adopted safety rule so provenance is visible.
# Functionally identical to block_patterns (hard block). Keep both lists
# populated where appropriate so the rule source is self-documenting.
