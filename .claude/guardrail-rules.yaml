dangerousPatterns:

# ============================================================
# PATH RULES (LEGACY — RESERVED PRE-P2.5)
# ============================================================
# Kept for backward compatibility with downstream projects that loaded the
# older schema. P2.5 (this file) introduced `zeroAccessPaths` / `readOnlyPaths` /
# `noDeletePaths` above; those are the enforced tiers. `path_rules` is
# documented placeholders only — neither `evaluate()` nor `checkPathAccess()`
# act on it.
# ============================================================

path_rules:

  # Paths that should NEVER be touched by any automated command.
  # Add absolute or relative paths. Wildcards are not yet supported.
  zero_access:
    - .env                             # root .env (local secrets)
    - .env.local                       # local override secrets
    - .env.production                  # production secrets
    - .env.development                 # development secrets
    - .env.staging                     # staging secrets
    - .env.*.local                     # per-environment local overrides
# .githooks/ removed 2026-05-09 — see zeroAccessPaths comment above.

  # Paths that can be read but must not be overwritten or deleted.
  read_only:
    - .claude/settings.json            # hook registry — only the orchestrator edits this
    - package-lock.json                # lockfile — only npm manages this
    - docs/architecture/overview.md            # architecture source of truth
