# ============================================================
# Guardrail Rules — .claude/guardrail-rules.yaml
# ============================================================
#
# This file configures the PreToolUse guardrail hook for the shell tools
# (.claude/hooks/guardrail.cjs, matcher Bash|PowerShell: Claude Code on
# Windows also runs commands through a PowerShell tool).
# Rules are evaluated in order within each section. The first match wins.
#
# HOW RULES WORK
# ==============
# Each entry under block_patterns, nudge_patterns, or confirm_patterns
# is a pattern string checked against the full shell command. Precedence:
#   block_patterns / dangerousPatterns  — hard stop (exit 2), never escalatable
#   nudge_patterns                       — soft deny (exit 2) with a "try a safer
#                                          alternative first" message; re-run the
#                                          same command with `# guardrail:confirm`
#                                          appended to escalate to a user confirm
#   confirm_patterns                     — user prompted yes/no immediately
# First match in that order wins.
#
# Pattern formats:
#   plain string  — case-insensitive substring match
#                   e.g. "rm -rf" matches "sudo rm -rf /"
#
#   /regex/       — JavaScript regex (case-insensitive)
#                   e.g. "/git push -+f/" matches any -f or --force flag
#
# KNOWN LIMITATION — SUBSTRING MATCHING
# ======================================
# Plain string patterns match anywhere in the command string.
# This means a pattern like "DROP TABLE" will also match:
#   - echo "run DROP TABLE to clean up" >> notes.md
#   - grep -r "DROP TABLE" src/
# Use /anchored-regex/ patterns for SQL keywords and other terms
# that may legitimately appear inside echo, grep, or comment strings.
# Double-spaced or tab-separated variants are normalized before plain-string
# matching (runs of whitespace collapse to a single space), so "git  reset
# --hard" DOES match "git reset --hard" (hooks-C3). /regex/ patterns are not
# normalized — use \s+ between tokens for whitespace tolerance in a regex.
#
# ADVISORY, NOT AUTHORITATIVE: this guardrail is a best-effort speed-bump, not a
# security boundary. Alternate verbs, encodings, and subshells can always be
# constructed; the Claude Code permission system is the real gate.
#
# Exit codes produced by the hook:
#   2  — BLOCKED   command is hard-stopped (only exit code 2 blocks in Claude Code)
#   0 + JSON "ask" — CONFIRM   user is prompted yes/no before proceeding
#   0  — PASS      command is safe, no output, execution continues
#   1  — WARNING   Claude Code treats this as non-blocking, command STILL RUNS
#
# HOW TO ADD CUSTOM RULES
# =======================
# 1. Add a pattern string under block_patterns or confirm_patterns.
# 2. Use a plain substring for simple matches.
# 3. Use /regex/ for multi-variant patterns (flags, alternatives).
# 4. Comment the rule inline to document why it exists.
# 5. Save the file — changes apply immediately on the next hook invocation.
#
# HOW TO TEMPORARILY DISABLE A RULE
# ===================================
# Comment out the line with #. The YAML parser strips inline comments,
# so "- rm -rf   # disabled" still fires. Move the rule to a comment-only
# block or delete the line entirely to disable it.
#
# ============================================================

# ============================================================
# BLOCK PATTERNS (hard block — exit 2, no option to proceed)
# ============================================================
# Catastrophic / irreversible commands that have no legitimate
# automated use. If you actually need these, run them manually
# in your terminal.
# ============================================================

block_patterns:

  # --- Git: Force push (overwrites remote history, cannot be undone) ---
  # Regex (not plain string). A negative lookahead keeps `--force-with-lease`
  # EXCLUDED so it falls through to its confirm rule below (hooks-m1) — in Claude Code
  # `permissions.deny` hard-denies it before that confirm can run (see the DECISION there). The rule
  # tolerates INTERVENING TOKENS between `git` and `push` — the old contiguous
  # `git push --force` was trivially evaded by a global option before `push`
  # (`git -c k=v push --force`) or another flag after it (`git push --quiet
  # --force`). `(?:\s+\S+)*?` LAZILY consumes leading git global options (any
  # token — value-taking `-c k=v` included). It replaces an earlier nested-
  # optional `(?:\s+-\S+(?:\s+\S+)?)*` that had catastrophic-backtracking
  # ambiguity (ReDoS: ~483ms at 36 all-dash tokens, unbounded) — since this hook
  # runs on EVERY Bash command, that was a live DoS + fail-open risk. `\S+` is
  # unambiguous and the lazy `*?` stops at the first `push`, so runtime is linear.
  # After `push`, `[^;&|\n]*` tolerates intervening flags before the force flag
  # but is BOUNDED to a single command — an unbounded `.*` mis-attributed a
  # chained command's flag to push (`git push origin main && rm --force /tmp/x`
  # hard-blocked as a "force push"). The alternation also catches the short
  # `-f`/combined `-vf`/`-fv` clusters. (M — non-contiguous force-push evasion; ReDoS-safe)
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*(?:--force(?!-with-lease)\b|\s-\w*f\w*\b)/
  - git push -f                             # short force flag (belt-and-suspenders; also covered above)
  # Refspec force push (`git push origin +main`, `+HEAD:main`): a leading `+` on
  # a refspec forces the update with NO flag at all — the flag-based rule above
  # never sees it. Match a `+`-prefixed refspec token after `git push`, BOUNDED to
  # the same command (`[^;&|\n]*`). The ref must START with a letter/`_`/`/`
  # (`[A-Za-z_/]`) — a leading DIGIT is excluded so a benign trailing note like
  # `git push origin main   deploy +1` doesn't false-block, and (deliberately) a
  # literal `#` is kept OUT of the regex because the rule-file comment stripper
  # truncates any `#`, which would invalidate the pattern and drop the whole tier.
  # Tolerates the same intervening git global options as the force-flag rule
  # above (`git -c k=v push origin +main` used to evade — the flag rule only
  # sees `--force`/`-f`, not a bare `+refspec`, so this sibling rule needed
  # the identical `(?:\s+\S+)*?` lazy-global-option prefix). (M — +refspec
  # global-option evasion)
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*\s\+[A-Za-z_/][^\s:]*(?::[^\s:]+)?(?:\s|$)/

  # `git push --mirror` is a force form with no force flag: it overwrites every remote ref (rewritten
  # history included) and DELETES remote refs the local repo lacks, and the rules above never see it
  # (SF-1.9 review J-3; executed against a bare remote, rc 0, history replaced). git accepts any unambiguous
  # prefix of a long option, and `--m`, `--mi`, `--mir`, `--mirr` and `--mirro` all select it (verified
  # against git on a local bare remote, 2026-11-18; `--forc`/`--for` are ambiguous and rejected), so the
  # rule matches `--m` plus an optional run of the rest of the word. Same global-option tolerance and
  # single-command bound as the force-flag rule. `--no-mirror` is not matched (the `--` must be followed by `m`).
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*\s--m(?:i(?:r(?:r(?:o(?:r)?)?)?)?)?(?=[\s'"=]|$)/

  # --- Git: config- and alias-injected force pushes (SF-1.9 review J-4) ---
  # A force push needs no flag on the `git push` command line when the forcing is injected through git
  # configuration, so none of the rules above (and no `permissions.deny` glob, which needs the literal
  # `git push ` text) sees it. Each form below was executed against a bare remote and replaced its history:
  #   git -c alias.x='push -f' x origin main            inline alias whose body pushes
  #   git -c remote.origin.push=+refs/heads/main:refs/heads/main push     forced refspec from config
  #   git -c remote.origin.mirror=true push             mirror from config
  #   git config alias.p 'push -f' ; git p              persisted alias (and the persisted refspec/mirror twins)
  # Alias bodies are matched on the word `push`, not on a force flag: the body can reach the flag through a
  # shell function or a second alias, so any alias that pushes is refused here (a push alias is rare and is
  # easy to add by hand). `git config alias.st status` and an unforced `remote.origin.push` refspec pass.
  - /git\b[^;&|\n]*(?:-c\s*|config\b[^;&|\n]*\s)["']?alias\.[^\s=]+[=\s]["']?!?[^;&|\n]*\bpush\b/
  - /git\b[^;&|\n]*(?:-c\s*|config\b[^;&|\n]*\s)["']?remote\.[^\s=]+\.(?:push[=\s]["']?\+|mirror\b)/
  # `--config-env=alias.x=VAR` is the same injection with the value read from an environment variable, so
  # the alias body is not in the command text: any alias or push/mirror key set that way is refused.
  - /git\b[^;&|\n]*--config-env[=\s]\s*["']?(?:alias\.|remote\.[^\s=]+\.(?:push|mirror)\b)/
  # The same keys injected through the environment (GIT_CONFIG_COUNT/KEY_n/VALUE_n or the older
  # GIT_CONFIG_PARAMETERS) never appear on the command line at all.
  - /\bGIT_CONFIG_(?:PARAMETERS|COUNT|KEY_\d+)\s*=/

  # --- Git: remaining config-sourced and plumbing routes to a mirror, force or prune push (final-core security M1) ---
  # Each form below changes what a plain `git push` does (or pushes without `git push`) and none of them
  # carries a force flag, so no rule above and no `permissions.deny` glob sees it. All were reproduced
  # against a bare remote. The structural control is the managed pre-push hook's refusal of every
  # non-fast-forward update and every ref deletion (`.agents/core/git-hooks.js`); these rules stop the
  # routes the hook cannot see and the setup of the others. Text rules cannot list git's config sources.
  #   git config include.path /x, git -c include.path=/x push, includeIf.<cond>.path, --config-env
  #                                        the included file sets remote.<name>.mirror or a forced refspec
  - /git\b[^;&|\n]*(?:-c\s*|config\b[^;&|\n]*\s)["']?include(?:if\.[^\s=]+)?\.path\b/
  - /git\b[^;&|\n]*--config-env[=\s]\s*["']?include/
  #   GIT_CONFIG_GLOBAL=/x git push (also GIT_CONFIG_SYSTEM, HOME, XDG_CONFIG_HOME)
  #                                        points git at an attacker-chosen global config; bounded to one
  #                                        command so `HOME=/x npm test && git push` does not match. An
  #                                        `export` in an earlier command is not followed (a known limit).
  - /(?:^|[\s;&|(])(?:GIT_CONFIG_GLOBAL|GIT_CONFIG_SYSTEM|HOME|XDG_CONFIG_HOME)=\S*[^;&|\n]*\bgit\b[^;&|\n]*\bpush\b/
  #   git remote add --mirror[=push|fetch] <name> <url> (and every abbreviation git accepts, `--mi` to `--mirror`:
  #   `--m` is ambiguous with `--master` and refused), then git push <name>
  - /git\b[^;&|\n]*\bremote\s+add\b[^;&|\n]*\s--mi(?:r(?:r(?:o(?:r)?)?)?)?(?=[\s'"=]|$)/
  #   git send-pack / git-send-pack: plumbing push that runs no pre-push hook
  - /\bgit(?:-|\b[^;&|\n]*\s)send-pack\b/
  #   AGENTS_ALLOW_FORCE_PUSH=...: the owner-only override of the managed pre-push refusal of
  #   deletions, non-fast-forward updates and mirror pushes (git-hooks.js); an agent never sets it
  - /\bAGENTS_ALLOW_FORCE_PUSH\s*=/
  #   AGENTS_ALLOW_AUTO_PUSH=...: the owner-only override of the managed pre-push refusal of any push to
  #   refs/heads/auto/* (git-hooks.js): an auto/* branch is the self-improvement cycle's model-written change and
  #   is reviewed and merged locally, never published by an agent
  - /\bAGENTS_ALLOW_AUTO_PUSH\s*=/
  #   AGENTS_ALLOW_IMPROVEMENT_CONFIG=...: the owner-only override of commit.js's refusal of a staged change to
  #   improvement.autoApply, .graduation, .watch or .budget in .claude/gate.config.json (the switch and thresholds of the
  #   unattended apply); an agent never sets it
  - /\bAGENTS_ALLOW_IMPROVEMENT_CONFIG\s*=/
  #   git push ... auto/<name> (a bare name, HEAD:auto/<name>, refs/heads/auto/<name>, quoted or not): the text-level
  #   twin of the pre-push auto/* refusal, for a checkout whose managed hooks are not active. Best effort like the
  #   rules above (a refspec built from a variable is not seen); the hook reads git's own ref lines and is the wall.
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*[\s:'"](?:refs\/heads\/)?auto\/\S/

  # --- Secret files: shell reads and copies of the six Owner Decision 4 names (SF-1.9 review J-2) ---
  # `permissions.deny` Read/Edit rules gate the built-in file tools only; a Bash or PowerShell subprocess
  # (`cat .env`, `grep -r KEY .env.production`, `cp .env /tmp/x`, `node -e "...readFileSync('.env')..."`,
  # `python -c`, `base64 .env`, `Get-Content .env`) never reaches them. This is the speed bump behind the
  # wall, and a hard block, not an escalatable nudge, so "told to proceed" cannot waive it. It matches the
  # NAME as a whole path segment (preceded by start, whitespace, a quote, `=`, `:`, `/`, `<`, `>` or `(`,
  # followed by end, whitespace, a quote, `;`, `&`, `|`, `)`, `<`, `>` or a glob character), so the
  # names `.env`, `.env.local`, `.env.production`, `.env.development`, `.env.staging` and `.env.<name>.local`
  # are caught and `.env.example`, `.env.sample`, `.env.template`, `.env.test` and `.envrc` stay free.
  # A mention that only names the file (`echo .env >> .gitignore`) is blocked too: the cost is one rerun by
  # hand, which is what a hard wall on secrets should cost. The real boundary for unattended runs is the
  # sandbox (`sandbox.filesystem.denyRead`, SF-3.8); this hook is advisory like every rule in this file.
  - /(?:^|[\s'"=:\/<>(])\.env(?:\.local|\.production|\.development|\.staging|\.[A-Za-z0-9_-]+\.local|\.[*?])?(?=$|[\s'"`;&|)<>*?])/

  # --- Session and scheduled-run credentials: shell reads, copies and sends (final-core security M2) ---
  # `~/.config/claude/` holds the unattended-run token (SF-3.8's oauth-token.conf) and `.credentials.json`
  # is Claude Code's own login file. `permissions.deny` gates the built-in Read and Edit tools for both;
  # `cat`, `base64`, `curl -d @file`, `grep -r` and a script never reach it, so this is the speed bump behind
  # it, a hard block like the `.env` rule above and best-effort in the same way (a path built from a variable
  # or a symlink is not seen). The name is matched as a whole path segment: `.config/claude` itself or
  # anything below it, and the file `.credentials.json`. `.config/claudette` and `my.credentials.json.bak` stay free.
  - /(?:^|[\s'"=:\/<>(~])\.config\/claude(?=$|[\s'"`;&|)<>*?\/])/
  - /(?:^|[\s'"=:\/<>(])\.credentials\.json(?=$|[\s'"`;&|)<>*?])/

  # --- Database: Schema destruction ---
  # Anchored regexes prevent false positives on echo/grep commands that
  # mention these SQL keywords in strings or test names.
  # No trailing `/i`: matchesPattern only accepts the bare `/expr/` form and is already case-insensitive
  # (a flagged entry silently never matched — SF-1.10 wave 8 review M3).
  # Destroys tables, databases or schemas; empties all rows:
  - /^\s*(DROP\s+TABLE|DROP\s+DATABASE|DROP\s+SCHEMA)\b/
  # (not followed by a dash option: the shell `truncate -s 0 file` is a different command)
  - /^\s*TRUNCATE\s+(?!-)/
  # The same statements passed to a SQL client on the command line (`psql -c "DROP TABLE x"`):
  - /^\s*(?:psql|mysql|mariadb|sqlite3|sqlcmd|duckdb)\b[^\n]*\b(?:DROP\s+(?:TABLE|DATABASE|SCHEMA)|TRUNCATE\s+(?:TABLE\s+)?\w)/

  # --- Disk / OS: Low-level format commands ---
  - format c:                          # Windows disk format
  - mkfs                               # Linux filesystem format (any variant: mkfs.ext4, etc.)
  # `dd` device-wipe: match `dd` + an `if=/dev/zero|random` ARGUMENT in any order,
  # not the contiguous `dd if=/dev/zero` literal — `dd bs=1M if=/dev/zero of=/dev/sda`
  # (option before if=) evaded the old literal. Bounded to one command. (M — reordered-token evasion)
  - /\bdd\b[^;&|\n]*\bif=\/dev\/(?:zero|u?random)\b/   # zero/random/urandom-wipe a block device (any arg order)
  - fdisk                              # interactive partition editor (destructive if scripted)
  - diskpart                           # Windows partition manager (destructive if scripted)


# ============================================================
# NUDGE PATTERNS (try a safer alternative first — confirm on demand)
# ============================================================
# Destructive / hard-to-reverse commands that DO usually have a safer
# alternative. On a plain match the hook DENIES (exit 2) and tells the
# agent to try a reversible path first (mv the target aside, `git rm`,
# trash/recycle, dry-run, or scope tighter). If the agent has genuinely
# confirmed there is no reversible alternative, it re-runs the SAME
# command with the escalation marker appended:
#
#     rm -rf build  # guardrail:confirm
#
# ...and the hook escalates to a user yes/no confirm. Precedence sits
# between block and confirm: block_patterns / dangerousPatterns still
# win and IGNORE the marker (never escalatable); confirm_patterns are
# checked after these. Move a pattern here (rather than confirm_patterns)
# when "try something else first" is the right default; keep it in
# confirm_patterns when an immediate prompt is fine.
# ============================================================

nudge_patterns:

  # --- Filesystem: Recursive deletion ---
  # rm -rf / -fr: nudge EXCEPT when the FIRST argument is a clearly-disposable
  # path. Autonomous sub-agents (code-reviewer verification, /run-todo e2e)
  # routinely create + delete scratch dirs; nudging on every cleanup would stall
  # the flow, so disposable first-args are exempted entirely (pass, no nudge).
  #
  # CRITICAL — the exemption binds to the FIRST rm argument (the lookahead sits
  # immediately after the flags, with NO leading `.*`). An earlier version used
  # `(?!.*(…))` which scanned the whole line, so a trailing exempt token disarmed
  # the guard for a dangerous target — e.g. `rm -rf ~/important && echo /tmp`
  # passed silently. Binding to the first arg closes that bypass: the temp token
  # must be the rm target itself. Chained dangerous deletes still fire because
  # the matcher also matches a later `rm -rf <dangerous>` segment; substring
  # look-alikes like `~/node_modules_backup` fire (token must START the arg).
  #
  # Exempted (no nudge) — only when it is the rm's first argument:
  #   /tmp, /tmp/...            (Linux/WSL temp)
  #   ./tmp/ or tmp/ relative   scratch dirs
  #   $TMPDIR / $TMP / $T*      variables
  #   mktemp                    (rare: mktemp literal right after the flags)
  #   node_modules              (always reinstallable)
  #   /var/folders/             (macOS GUI temp)
  #   .sandbox                  (the repo's gitignored disposable area)
  #   bin/ obj/ dist/           regenerable build output (also ./bin/ etc.)
  #   coverage/ TestResults/    regenerable test/coverage output
  # NOTE: .output/ and .worktrees/ are deliberately NOT exempt — deleting them
  # destroys generated reports / live worktrees, so they still nudge. (2026-06-21)
  # Real project-path deletes (rm -rf ./src, repo root, ~, /, sudo rm -rf /etc)
  # nudge first, then confirm via `# guardrail:confirm`. The path-tier check
  # (zeroAccess/readOnly/noDelete) remains the hard guard for protected paths.
  #
  # `git rm` is EXEMPT (negative lookbehind `(?<!(?:^|[\s;&|(])git )`): it stages
  # a history-preserving removal that `git checkout`/`git restore` fully reverses,
  # so it IS the reversible alternative this nudge tells you to use — nudging it
  # would loop the agent against its own advice. The boundary group `(?:^|[\s;&|(])`
  # anchors the exemption to a real `git` INVOCATION (start / after whitespace or
  # `;`/`&`/`|`/`(`), so `legit rm` and `X=git rm` (a var-assignment prefix on a
  # real rm) still fire — only a standalone `git rm` is exempt. (sweep A3)
  # The flag matcher accepts BOTH the short cluster (`-rf`, `-r`, `-fr`) AND the
  # GNU long forms `--recursive` / `--force`, so `rm --recursive --force <path>`
  # and mixed `rm -r --force` / `rm --force -r` no longer evade the nudge (M —
  # long-form flag evasion). The first-arg disposable-path exemption lookahead
  # still follows the flag token, so short-form exemptions (`rm -rf /tmp/…`) are
  # unaffected; long-form + a disposable path may still nudge (acceptable).
  # (2026-06-03; first-arg-bound 2026-06-05; moved confirm→nudge + git-rm-exempt 2026-06-06; boundary-anchored 2026-06-06; long-form flags 2026-07-16)
  - /(?<!(?:^|[\s;&|(])git )rm\s+(?:-[a-z]*[rf][a-z]*|--(?:recursive|force))\s+(?!["']?(\.?\/?tmp\/|\/tmp|\$\{?T|mktemp|node_modules|\/var\/folders\/|\.sandbox|\.?\/?bin\/|\.?\/?obj\/|\.?\/?dist\/|\.?\/?coverage\/|\.?\/?TestResults\/))/
  # Windows silent recursive delete (cmd.exe) — either flag order (`del /s /q`
  # or `del /q /s`), bounded to one command. NOTE: matchesPattern only recognizes
  # the `/expr/` regex form (no trailing flags) and applies case-insensitivity
  # itself — a trailing `/i` would make this parse as neither regex nor substring
  # and silently never match, so it is intentionally omitted. (M — reversed-flag evasion)
  - /\b(?:del|erase)\b[^;&|\n]*(?:\/s\b[^;&|\n]*\/q\b|\/q\b[^;&|\n]*\/s\b)/
  # cmd.exe recursive directory removal (`rd /s`, `rmdir /s`), anchored to a command
  # start so `rd` as an argument (`grep rd -r`) never matches.
  - /(?:^\s*|[;&|(]\s*)(?:cmd(?:\.exe)?\s+\/[ck]\s+)?(?:rd|rmdir)\b[^;&|\n]*\/s\b/
  # PowerShell recursive force remove. `.*` (not `.+`) so the canonical single-space
  # `Remove-Item foo -Recurse -Force` matches, and a second alternation covers the
  # reverse flag order `-Force … -Recurse`. (sweep A2)
  - /Remove-Item\b.*(-Recurse\b.*-Force|-Force\b.*-Recurse)\b/
  # The same through PowerShell's aliases (ri/rd/rmdir/Remove-Item) and its abbreviated
  # parameters (`-r`/`-Rec`… and `-fo`/`-Forc`…, either order), anchored to a command
  # start. Claude Code's Windows PowerShell tool reaches this hook.
  - /(?:^\s*|[;&|(]\s*)(?:Remove-Item|ri|rd|rmdir)\b[^;&|\n]*(?:\s-r(?:e(?:c(?:u(?:r(?:s(?:e)?)?)?)?)?)?\b[^;&|\n]*\s-fo(?:r(?:c(?:e)?)?)?\b|\s-fo(?:r(?:c(?:e)?)?)?\b[^;&|\n]*\s-r(?:e(?:c(?:u(?:r(?:s(?:e)?)?)?)?)?)?\b)/

  # --- Git: Working tree destruction (moved from confirm 2026-06-06) ---
  # Only the WORK-LOSING `git reset --hard` is nudged (stash first). Non-hard
  # resets — `--soft`, `--mixed`/default, `git reset HEAD~1`, `git reset -- <file>`
  # (unstaging) — are safe & reversible (they never touch the working tree), so
  # they are NOT nudged; nudging them was pure friction. (narrowed 2026-06-21)
  # Regex (not contiguous literals) so an intervening git global option or an
  # interposed flag doesn't evade — `git -c x reset --hard`, `git reset -q --hard`,
  # `git clean -q -fd` all slipped past the old plain-string rules. Each is bounded
  # to one command (`[^;&|\n]*`). (M — non-contiguous evasion of the sibling nudges)
  - /git\b[^;&|\n]*\breset\b[^;&|\n]*--hard\b/          # discards all uncommitted changes → stash first
  - /git\b[^;&|\n]*\bcheckout\b[^;&|\n]*\s--\s+\./      # bulk-resets tracked files (checkout -- .) → stash first
  - /git\b[^;&|\n]*\bclean\b[^;&|\n]*(?:\s-\w*f\w*\b|--force\b)/  # -f/-fd/-fX/--force untracked delete → `git clean -n` first

  # --- Git: History rewriting (moved from confirm 2026-06-06) ---
  # Reflog-recoverable, but back up the branch first (git branch backup/<name>)
  # before rewriting; escalate when the rewrite is the intended operation.
  # NOTE: `git commit --amend` is intentionally NOT nudged — amending the last
  # (unpushed) commit is a routine, reflog-recoverable edit; the nudge was pure
  # friction on message fix-ups. Force-push protection (above) still guards the
  # genuinely dangerous case of rewriting already-shared history.
  - git rebase                         # rewrites commit history → backup branch first

  # --- Git: Stash destruction (moved from confirm 2026-06-06) ---
  # The stash IS the backup — confirm there's a copy (git stash show -p > patch)
  # before dropping; escalate when the entry is genuinely disposable.
  - git stash drop                     # permanently removes a stash entry
  - git stash clear                    # permanently removes ALL stash entries

  # --- Package management: local removal (moved from confirm 2026-06-06) ---
  - npm uninstall -g                   # globally removes packages → reinstallable, nudge

  # --- File: Bulk destructive find -exec (moved from confirm 2026-06-06) ---
  # find -exec: nudge only when the exec runs a DESTRUCTIVE command
  # (rm/mv/dd/truncate/tee/chmod/chown/sh/bash). Read-only execs like
  # -exec grep / cat / ls never match. Try a tighter scope or a dry `-print`
  # first; escalate with the marker when the sweep is intended.
  - /find\s+.+-exec\s+(rm|mv|dd|truncate|tee|chmod|chown|sh|bash)\b/
  # find … -delete: the built-in deletion sibling of -exec rm (G3). A protected
  # target (e.g. `.env`) is ALSO hard-blocked by the four-tier path check before
  # this nudge is reached; this rule covers the general case.
  - /find\s+.+-delete\b/

  # --- Processes: pattern-based kill ---
  # `pkill -f` / `pkill --full` match the WHOLE command line of every process, so
  # a pattern like `vitest` or `node` also kills the agent's own shell, sibling
  # agents and a running gate (field case: a wave agent's `pkill -f` killed its
  # own shell and orphaned a gate). `killall` kills every process with that name.
  # Stop a process by PID or port instead (`kill <pid>`,
  # `kill $(lsof -t -i:<port>)`). Plain `pkill <name>` (exact process name) is
  # left alone. Anchored to command position (start, after ; & | ( ` { or $( )
  # with optional wrappers (sudo, env, nohup, timeout N, xargs, VAR=val ...) and
  # an optional path prefix, so quoted text in a commit message or a grep for
  # the word does not fire. Escalate with `# guardrail:confirm`. (2026-11-07)
  - /(?:^|[;&|(`{]|\$\()\s*(?:(?:sudo|doas|env|nohup|command|exec|time|nice|xargs|setsid|busybox)(?:\s+-\S+)*\s+|timeout\s+(?:-\S+\s+)*\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:\S*\/)?(?:pkill\b[^;&|\n]*\s(?:-[a-z0-9]*f[a-z0-9]*|--full)(?=\s|$)|killall\b)/

# ============================================================
# CONFIRM PATTERNS (user prompted yes/no before proceeding)
# ============================================================
# Risky but legitimate. You'll be asked before these run.
# ============================================================

confirm_patterns:

  # Only outward-facing / irreversible-external operations remain here — a human
  # gate is the right posture and the nudge tier's "try a safer alternative
  # first" has no path that still achieves the goal. All LOCAL, reversible
  # destructive commands (working-tree/history/stash destruction, npm uninstall
  # -g, destructive find -exec) moved to nudge_patterns 2026-06-06.

  # --- Git: Remote branch/tag operations (outward-facing — touch the remote) ---
  # Deletion flags apply to any remote, including after Git global options.
  - /git\b(?:\s+[^\s;&|]+)*?\s+push\b[^;&|\n]*\s["']?(?:--de(?:l(?:e(?:t(?:e)?)?)?)?|-[a-z]*d[a-z]*)["']?(?:\s|$)/
  # A deletion refspec has an EMPTY source (":destination"). A nonempty
  # source such as "refs/tags/v1.0:refs/tags/v1.0" is an ordinary additive push.
  # Empty quote pairs before the colon still mean an empty source to the shell.
  - /git\b(?:\s+[^\s;&|]+)*?\s+push\b[^;&|\n]*\s(?:''|"")*["']?:[^\s;&|]+/
  # Tolerates the same intervening git global options as the block-tier force
  # rule (`git -c k=v push --force-with-lease` used to fall through to a bare
  # pass — no confirm at all — since `git\s+push\s+` required the two tokens
  # contiguous). (M — global-option evasion, sibling of the force-push fix)
  # DECISION (SF-1.9, Owner Decision 4 "the force forms of git push"): in Claude Code a lease push is a force
  # form and is HARD-DENIED by `permissions.deny` (`Bash(git push *--force*)`, which `--force-with-lease`
  # matches, plus the `git -C`/`git -c` twins). A deny wins over a hook `ask`, so this confirm never runs there:
  # nobody can approve a lease push in Claude Code. The rule stays for Codex, which does not read
  # `.claude/settings.json` and so has no deny set (the hook is its only layer for this), and as the backstop if
  # the deny set regresses in a Claude Code upgrade. `claude-permissions.test.js` pins both halves.
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*--force-with-lease/ # safer force push, still rewrites remote: user confirm where no deny exists (Codex); hard-denied in Claude Code (see DECISION above)

  # `git push --prune` deletes every remote ref that has no local counterpart under the pushed refspecs
  # (`git push --prune origin 'refs/heads/*:refs/heads/*'` removed a remote branch in a bare-remote probe), the
  # same effect as `--delete` above with no deletion flag, so it asks the same way. git accepts `--pru` and `--prun`
  # (`--p` and `--pr` are ambiguous and refused).
  - /git\b(?:\s+\S+)*?\s+push\b[^;&|\n]*\s--pru(?:n(?:e)?)?(?=[\s'"=]|$)/

  # --- Secret-scan bypass: the audited bypass is the USER's decision, never the agent's ---
  # CLAUDE_COMMIT_NO_SCAN=1 (and commit.js --no-scan, which sets it) makes the managed git hooks and commit.js
  # skip the secret scan. It is recorded as a guardrail event, but nobody approved it: ask the user first.
  # Matched on the NAME, not on `=1`: the value can be written $'1', $(echo 1), `echo 1`, "1" or built by
  # printf -v / export / declare / env, and a mention that only reads it costs the user one yes/no.
  - /CLAUDE_COMMIT_NO/
  - /commit\.js\b[^;&|\n]*\s["']*--["']*no["']*-["']*scan/

  # --- Package management: publish (irreversible — public registry) ---
  - npm publish                        # publishing to npm registry (irreversible)


# ============================================================
# FOUR-TIER PATH SCHEMA (A3 — P2.5)
# ============================================================
# Extended from PI Agent's damage-control four-tier model
# (`docs/research/competitive/_hooks-and-core-scripts-comparison.md` §A3).
# Operation-aware path tiers — the first matching tier wins.
#
#   zeroAccessPaths  — read AND write AND delete blocked
#   readOnlyPaths    — read allowed; write AND delete blocked
#   noDeletePaths    — read AND write allowed; delete blocked
#
# Integration status:
#   Shell delete ops (Bash and PowerShell: rm / del / erase / unlink /
#     Remove-Item and its aliases ri / rd / rmdir, including `cmd /c`)
#                                                    — ENFORCED by guardrail.cjs.
#   Edit / Write / MultiEdit / NotebookEdit tool ops — ENFORCED by
#     path-guardrail.cjs (PreToolUse), through `_lib/guardrail-rules.js`
#     (`checkPathAccess`) and `_lib/command-blocker.js` (`checkFreezeState`).
#   Known advisory gaps (not recognized as deletes): nested shells
#     (`powershell -c "ri .env"`, `pwsh -Command …`, `bash -c "rm .env"`),
#     pipelines (`gci .git | ri -r -fo` is only nudged), and .NET or script
#     APIs (`[IO.File]::Delete('.env')`). The hook is a speed-bump, not a boundary.
#
# Globs: `path/` (directory prefix), `*` (non-slash wildcard), `name.ext`
# (suffix match). No `**` support yet.
# ============================================================

# Tier 1 — zero-access: the guardrail blocks ALL operations.
# Enforcement today: any `rm <path>` against these entries is blocked.
zeroAccessPaths:
  - .env                               # root .env (local secrets)
  - .env.local                         # local override secrets
  - .env.production                    # production secrets
  - .env.development                   # development secrets (Owner Decision 4 name; SF-1.9 review M-2)
  - .env.staging                       # staging secrets (Owner Decision 4 name)
  - .env.*.local                       # per-environment local overrides, e.g. .env.test.local (single-segment * only)
  - .git                               # deleting .git destroys all VCS history — catastrophic + irreversible
  - .git/                              # ...and its internals; non-escalatable so `rm -rf .git # guardrail:confirm` can't downgrade to a user-confirm (sweep C-followup: .git was demonstrated as a chained bypass but was never a protected tier). Segment-anchored matching keeps .gitignore/.github/.gitattributes clear.
  - .config/claude/                    # the unattended-run token directory (SF-3.8) and the user-level Claude Code settings; a Write or Edit here is blocked for everyone (final-core security M2)
  - .credentials.json                  # Claude Code's own login file
# .githooks/ removed 2026-05-09 — no tracked git hook directory is scaffolded
# by adopters, so a tier-1 rule here would be defending an empty boundary. The
# secret scan's git hooks (git-hooks.js) are untracked files in the git dir.

# Tier 2 — read-only: reads allowed, writes/deletes blocked.
# Pre-populated (A6 from ECC — `everything-claude-code` §config-protection)
# with linter/formatter/build-tool configs that should only be edited
# intentionally, not by automation. Do not edit this file to lift one: a
# project that needs automation to rewrite an entry (e.g. `npm init`
# regenerating package-lock) lists the exact entry under `except:
#   readOnlyPaths:` in the project-owned .claude/guardrail-rules.project.yaml,
# which updates never overwrite (this file is replaced by every update).
#
# 2026-04-25 audit pass — first day with the PreToolUse:Edit/Write
# path-guardrail hook live. Three entries removed because they break
# legitimate /update-config + /create:project-architecture + Vitest tuning
# workflows; the hook would block its own home file in the case of
# .claude/settings.json. Kept entries are low-friction (rare edits + low
# false-positive risk).
readOnlyPaths:
  - package-lock.json                  # lockfile — only npm manages this (Bash, not Edit/Write)
  - .eslintrc*                         # ESLint config (A6 — ECC)
  - .prettierrc*                       # Prettier config (A6 — ECC)
  - .editorconfig                      # EditorConfig (A6 — ECC)
  - .claude/guardrail-rules.project.yaml  # project-owned override: a person edits it (an agent that could write it could lift its own guardrails)
  - .betterleaksignore                 # secret-scan suppressions: the USER decides which findings are reviewed false positives, never the agent
  - .gitleaksignore                    # same list under its older name
# Removed 2026-04-25:
#   .claude/settings.json         — /update-config skill must be able to edit this
#   docs/architecture/overview.md — /create:project-architecture + /review:update-docs write here
#   vitest.config*                — test tuning during refactor work is routine; explicit handoff flag
# Removed 2026-07-16 (harvested from an adopter):
#   tsconfig*.json                — the old "project does not use TS so zero friction" rationale
#                                   doesn't hold at template level: TS-heavy adopters legitimately
#                                   create/edit per-package tsconfigs as routine work (same rationale
#                                   as the vitest.config* removal).

# Tier 3 — no-delete: reads/writes allowed, deletes blocked.
# (Empty by default — populate with paths your workflow must not remove.)
# Empty forms accepted (all equivalent): `noDeletePaths:` (no children),
# `noDeletePaths: []`, or `noDeletePaths: {}`. See `_lib/yaml-parser.js` header.
noDeletePaths:

# Tier 4 — subagent read-only (SF-1.8): writes and deletes by a SUBAGENT are blocked; the main
# thread (a hook payload with no `agent_id`) and reads are unaffected. The protected set is the
# gate, its judges and their whole require() closure, the hooks, the guardrail rules and settings,
# the files that register or configure the hooks, and the judge's evidence and state files, so an
# implementer cannot weaken the judge that grades it. Plain `readOnlyPaths` cannot hold these: it
# also blocks the Main Agent, who edits hook sources and tests every wave.
#
# What this tier is and is not:
#   - It gates the Write, Edit, MultiEdit and NotebookEdit tools (`path-guardrail.cjs`) and, as a
#     best-effort layer, the Bash guard (`guardrail.cjs`): `rm`/`del`, redirects, `tee`, `cp`/`mv`/
#     `install`/`ln` destinations, `dd of=`, `sed -i`/`perl -i`, `git restore`/`git checkout -- <file>`/
#     `git rm`/`git mv` (also under `git -C`), `tar -C`/`unzip -d` destinations, `patch`/`git apply`/
#     `git am` of a patch that targets this tier (the Main Agent applies those) and a write call in an
#     inline `node -e`/`python -c` script. Relative targets resolve against the payload `cwd` and any
#     earlier `cd`/`pushd`/`popd` in the command. Bash coverage is NOT a wall: an interpreter script, a
#     variable-built path or a `claude -p` / `codex exec` subprocess (a new main thread with no
#     `agent_id`) writes anywhere. The backstop for those is the ship seal's code hash, which
#     covers the code tree including these files, plus review of the diff.
#   - It applies only to a payload that carries `agent_id` (a subagent of the session). A headless
#     main-thread run (`claude -p`, a scheduled run), an agent-team teammate or thread without an
#     `agent_id`, and Codex payloads that carry none are main threads to the hook: the tier is
#     inert there.
#   - Fail closed: when this file is missing, unusable, or parses without this key, the hooks hold
#     a subagent to the built-in copy of this list instead (`BUILTIN_SUBAGENT_READ_ONLY_PATHS` in
#     `_lib/guardrail-rules.js`, pinned equal to this list by a test).
#   - The entries are matched by a lexical, case-folded, UNANCHORED suffix/substring glob
#     (`gate.config.json` also matches `x-gate.config.json`, and `.agents/hooks/` also covers
#     `.agents/hooks/__tests__/`): harmless for a deny list, never reuse the matcher for an
#     allow list. A subagent test author cannot write hook tests; the Main Agent writes them.
# Why each family is listed:
#   gate and judge code ... gate.js and the receipt/ledger/freeze/rules libraries, ac-verify.js,
#                           ship-check.js, commit.js (runs the ship check), todo-completion.js,
#                           story-checkpoint.js (reuse decisions), plan-check.js and release-slice.js
#                           (read by the checkpoint and wave logic)
#   require() closure ..... every module the hooks and the judges load: a subagent that edits
#                           `hook-input.js` or `yaml-parser.js` switches the hooks off from the
#                           inside, and `gate-summary.js` turns test output into pass/fail counts,
#                           `telemetry-paths.js` decides where the seal is read from. A test walks the
#                           static require() graph from the judges and from EVERY hook registered for
#                           ANY event (Claude settings and the Codex adapter's hook registration) and
#                           fails when a reachable file is not matched by this list, so the list
#                           cannot rot when a helper is extracted; this list is the closure, kept
#                           honest by that test.
#   non-blocking hooks .... the memory, session and capture libraries (`memory-context.js`,
#                           `memory-notes.js`, `memory-recall.js`, `memory-paths.js`, `memory-manager.js`,
#                           `memory-capture.js`, `memory-sync.js`, `memory-decay.js`, `memory-ingest.js`,
#                           `sqlite-backend.js`, `hook-spawners.js`, `profile.js`, `constants.js`,
#                           `daily-log.js`, `handoff-path.js`, `run-stamp.js`, `output-paths.js`,
#                           `doc-drift.js`, `frontmatter.js` and the rest of that walk). The
#                           UserPromptSubmit and SessionStart hooks run as the main thread, outside any
#                           `agent_id` check, and their stdout is injected into the Main Agent's context:
#                           a subagent that edits a library they load plants persistent instructions
#                           there before any review sees the diff. The Main Agent edits these files.
#   the hook layer ........ .agents/hooks/, .claude/hooks/, .codex/hooks/ (the hooks themselves)
#   rules and settings .... the authored rules file, its rendered copy `.claude/guardrail-rules.yaml`
#                           (matched by the bare name), the authored settings file and the generated
#                           `.claude/settings.json` (a different path: the two never match each other)
#   hook registration ..... `.claude/settings.local.json` (gitignored, so no diff review sees it, and
#                           it can switch every hook off), the Codex adapter `.agents/adapters/codex/`
#                           and its generated `.codex/hooks.json` and `.codex/hook-identities.json`
#   generated wrappers .... `.claude/core/` and `.codex/core/` hold generated entry points that
#                           require() the authored files above; a subagent that repoints one runs
#                           a weakened gate while the authored file stays untouched
#   judge evidence ........ ac-verify records (freeze baselines) and the ship seal; a rewrite of
#                           either is caught only after the fact by the seal's records hash
#   judge state ........... the failure ledger (truncating it resets streaks and the budget counter),
#                           the gate receipt and its history, and the investigate freeze state (an
#                           emptied lock list unfreezes paths); all are written by CLIs run by the
#                           Main Agent
#   gate inputs ........... `vitest.config.mjs` and `tools/run-toolkit-tests.cjs` (this workshop's
#                           test leg: an `exclude` or a fake runner passes without testing), and every
#                           other name vitest or vite loads a config from (`vitest.config.ts`, `.mts`,
#                           `.cts`, `.js`, `.cjs` and the `vite.config.*` set): vitest ranks them above
#                           the walled `.mjs`, so the runner passes `--config` explicitly and refuses to
#                           run when another config exists. The names are listed one by one, not as a
#                           `vitest.config.*` wildcard, so a project can lift exactly the config file it
#                           owns (`except:`) without lifting the family.
#   test runner package ... `node_modules/`: the gate executes `node_modules/vitest`, and the ship seal's
#                           code hash never covers it (it is ignored). A subagent that patches the
#                           reporter makes every test pass and leaves no trace in any diff. No subagent
#                           has a legitimate Edit or Write there; `npm install` names no path, so the
#                           Bash guard does not fire on it. The gate also folds a hash of the runner
#                           package into the receipt's engine hash, so a changed runner invalidates
#                           the receipt even when the write came from a main thread or a script.
#                           `package.json` is deliberately NOT listed: ordinary dependency work edits it
#                           in every adopter. A weakened `scripts.test` is still caught by the ship
#                           seal's code hash (package.json is code) and by review. A project that wants
#                           it walled adds `package.json` to this tier in its project override.
# Glob rules are the same as the tiers above. A project lifts one entry with `except:
#   subagentReadOnlyPaths:` in the project-owned .claude/guardrail-rules.project.yaml.
subagentReadOnlyPaths:
  - gate.config.json
  - .agents/core/gate.js
